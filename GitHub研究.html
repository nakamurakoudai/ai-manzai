<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI漫才 台本プレイヤー</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f5f7ff;margin:0;padding:18px}main{max-width:620px;margin:auto}section{background:#1d2b41;padding:16px;border-radius:16px;margin:14px 0}button,select,input,textarea{font:inherit;border-radius:9px;padding:11px;margin:4px 0}button{background:#6bd3fa;color:#081928;border:0;font-weight:700}button:disabled{opacity:.4}input,textarea,select{box-sizing:border-box;max-width:100%;background:#fff;color:#111}textarea{width:100%;min-height:75px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#b5c7dc;font-size:.9em}#face{font-size:62px;text-align:center}#line{font-size:1.3em;min-height:60px;white-space:pre-wrap}#status{color:#a6e4ff;white-space:pre-wrap}label{display:block;margin:8px 0}button.secondary{background:#d7e1ef}button.warn{background:#ffb6ac}small{display:block}</style></head><body><main><h1>🎭 AI漫才 台本プレイヤー</h1><p class="muted">台本は公開サイトに含まれません。端末から読み込んで使います。</p><section><h2>台本</h2><label>JSON台本を読み込む <input id="file" type="file" accept=".json,application/json"></label><div class="row"><button id="export" class="secondary">台本をバックアップ</button><button id="clear" class="warn">端末内の台本を削除</button></div><p id="loaded" class="muted">未読み込み</p></section><section><div class="row"><label>モード <select id="mode"><option value="manzai">漫才</option><option value="qa">質問回答</option></select></label><label>あなたの役 <select id="role"><option value="A">A（AIはB）</option><option value="B">B（AIはA）</option></select></label></div><div id="face">🤖</div><p id="line">台本を読み込んでください</p><p id="status" role="status">準備中</p><div class="row"><button id="start">開始 / 最初から</button><button id="mic">🎤 話す</button><button id="next" class="secondary">次へ（手動）</button><button id="stop" class="secondary">停止</button></div><label>音声が使えない場合の文字入力<input id="typed" placeholder="セリフや質問を入力" style="width:100%"></label><button id="send" class="secondary">入力を送信</button><label>読み上げ速度 <input id="rate" type="range" min="0.7" max="1.4" step="0.1" value="1"></label></section><section><h2>音声診断</h2><p class="muted">マイクはHTTPSサイトでの使用を推奨。ブラウザの許可が必要です。音声認識にはネット接続が必要になる場合があります。</p><button id="diag" class="secondary">診断する</button><p id="diagnosis" class="muted"></p></section><p class="muted">台本はこのブラウザのlocalStorageに保存されます。共有端末では使用せず、ブラウザのデータ削除に備えてバックアップしてください。音声認識サービスに発話音声が送信される場合があります。</p></main><script>
'use strict';
const $=id=>document.getElementById(id);let script=null,index=0,recognition=null,listening=false,speaking=false,started=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function status(s){$('status').textContent=s}
function normalize(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'')}
function valid(data){return data&&Array.isArray(data.lines)&&data.lines.every(x=>x&&['A','B','R'].includes(x.role)&&typeof x.text==='string')&&(!data.qa||Array.isArray(data.qa)&&data.qa.every(x=>typeof x.question==='string'&&typeof x.answer==='string'))}
function setScript(data){if(!valid(data))throw Error('台本形式が正しくありません');script=data;index=0;started=false;localStorage.setItem('manzai_script_v4',JSON.stringify(data));$('loaded').textContent=(data.title||'無題')+' / '+data.lines.length+'セリフ';render()}
function render(){if(!script){$('line').textContent='台本を読み込んでください';return}if($('mode').value==='qa'){$('line').textContent='質問を話してください';return}const l=script.lines[index];$('line').textContent=l?`${index+1}/${script.lines.length} ${l.role==='R'?'リエ':l.role}：${l.text}`:'終演';}
function speak(text,after){speechSynthesis.cancel();speaking=true;const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=Number($('rate').value);u.onend=()=>{speaking=false;after?.()};u.onerror=()=>{speaking=false;status('読み上げに失敗しました');after?.()};speechSynthesis.speak(u)}
function halt(){if(recognition){try{recognition.abort()}catch(e){}}listening=false;speechSynthesis.cancel();speaking=false}
function aiRole(){return $('role').value==='A'?'B':'A'}
function advance(){if(!script)return;while(index<script.lines.length&&(!script.lines[index].text.trim()))index++;if(index>=script.lines.length){render();status('終演です');return}render();let l=script.lines[index];if(l.role===aiRole()||l.role==='R'){status('AIが話しています');speak(l.text,()=>{index++;advance()})}else{status('あなたの番です。🎤 話すを押してください')}}
function start(){if(!script){status('台本を先に読み込んでください');return}halt();index=0;started=true;if($('mode').value==='manzai')advance();else{render();status('質問してください')}}
function manual(){if(!script||$('mode').value!=='manzai')return;halt();started=true;index++;advance()}
function heard(text){status('認識：'+text);if(!script)return;if($('mode').value==='qa'){let n=normalize(text);let q=(script.qa||[]).find(x=>n.includes(normalize(x.question))||normalize(x.question).includes(n));if(q)speak(q.answer,()=>status('次の質問をどうぞ'));else status('該当する回答がありません');return}if(!started){status('まず開始を押してください');return}let l=script.lines[index];if(!l||l.role!==$('role').value){status('現在はあなたの番ではありません');return}let n=normalize(text),target=normalize(l.text);if(n&&target&&(n.includes(target)||target.includes(n)||similarity(n,target)>=0.55)){index++;advance()}else status('セリフが一致しません。もう一度話すか「次へ」で進めてください')}
function similarity(a,b){let m=Math.min(a.length,b.length),count=0;for(let i=0;i<m;i++)if(a[i]===b[i])count++;return count/Math.max(a.length,b.length,1)}
function listen(){if(!SR){status('このブラウザは音声認識に対応していません。HTTPS版のChromeをお試しください');return}if(!window.isSecureContext){status('安全な接続ではありません。HTTPSで開いてください');return}if(listening)return;speechSynthesis.cancel();speaking=false;let r=new SR();recognition=r;r.lang='ja-JP';r.interimResults=false;r.continuous=false;r.onstart=()=>{listening=true;status('🎤 聞き取り中…')};r.onresult=e=>{heard(e.results[e.resultIndex][0].transcript)};r.onerror=e=>{status('音声認識エラー：'+e.error+'（マイク許可・通信・HTTPSを確認）')};r.onend=()=>{listening=false};try{r.start()}catch(e){status('マイク開始失敗：'+e.message)}}
$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;setScript(JSON.parse(await f.text()));status('台本を読み込みました')}catch(err){status('読み込みエラー：'+err.message)}e.target.value=''};
$('export').onclick=()=>{if(!script)return status('台本がありません');let blob=new Blob([JSON.stringify(script,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='manzai_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('clear').onclick=()=>{if(confirm('この端末の台本を削除しますか？')){halt();localStorage.removeItem('manzai_script_v4');script=null;index=0;$('loaded').textContent='未読み込み';render();status('削除しました')}};
$('start').onclick=start;$('mic').onclick=listen;$('next').onclick=manual;$('stop').onclick=()=>{halt();status('停止しました')};$('send').onclick=()=>{heard($('typed').value);$('typed').value=''};$('mode').onchange=()=>{halt();render();status('モードを変更しました')};$('role').onchange=()=>{halt();index=0;started=false;render();status('役を変更しました。開始を押してください')};$('diag').onclick=()=>{$('diagnosis').textContent=`HTTPSなどの安全な環境: ${window.isSecureContext?'はい':'いいえ'} / 音声認識API: ${SR?'利用可能':'利用不可'} / 音声読み上げ: ${'speechSynthesis'in window?'利用可能':'利用不可'} / URL方式: ${location.protocol} / マイク許可状態はブラウザの設定で確認してください。`};
try{let old=localStorage.getItem('manzai_script_v4');if(old)setScript(JSON.parse(old));else status('台本JSONを読み込んでください')}catch(e){status('保存済み台本を読み込めませんでした')}
</script></body></html>
