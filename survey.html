<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>アンケート｜MICOLABO</title><meta name="description" content="MICOLABOの任意アンケートです。"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b1c;color:#fbfaff;font:16px/1.9 Arial,'Noto Sans JP',sans-serif}header{border-bottom:1px solid #45415d;padding:22px max(20px,calc((100vw - 900px)/2));}.logo{font:900 28px Arial Black,Arial,sans-serif;letter-spacing:-.05em;color:#d5ff65;text-decoration:none}.logo span{color:#f445b4}main{max-width:900px;margin:0 auto;padding:22px 18px 50px}h1{font-size:clamp(26px,5vw,38px);line-height:1.35}h2{font-size:19px;color:#d5ff65;margin:0 0 12px}section{padding:18px 22px;margin:14px 0;background:#24243e;border:1px solid #525273;border-radius:16px}p{margin:10px 0}a{color:#d5ff65;overflow-wrap:anywhere}.back{display:inline-block;margin:8px 0 16px}.date{color:#bfc0d8;font-size:14px}.note{padding:12px 18px;border-left:3px solid #f445b4;background:#201e36;color:#e4ddee}footer{text-align:center;color:#bfc0d8;border-top:1px solid #45415d;padding:24px 15px 36px;font-size:14px}footer a{margin:0 12px}@media(max-width:600px){section{padding:14px}}</style><style>fieldset{border:1px solid #525273;border-radius:14px;background:#24243e;margin:18px 0;padding:16px}legend{font-weight:bold;color:#d5ff65}label{display:block;padding:8px 0}input{accent-color:#d5ff65}button{background:#d5ff65;color:#17182f;border:0;border-radius:10px;padding:15px 24px;font-weight:bold;font-size:16px}button:disabled{opacity:.5}</style></head><body><header><a class="logo" href="./">MICOLABO<span>.</span></a></header><main><a class="back" href="./">← ミコラボに戻る</a><h1>感想はこちら</h1><p>回答は任意です。氏名やメールアドレスは不要です。今後のサービス改善・運営の参考にします。</p><p><a href="./privacy.html">プライバシーポリシー</a></p><form id="survey"><fieldset><legend>楽しめましたか？</legend><label><input type="radio" name="enjoy" value="very"> とても楽しかった</label><label><input type="radio" name="enjoy" value="yes"> 楽しかった</label><label><input type="radio" name="enjoy" value="neutral"> 普通</label><label><input type="radio" name="enjoy" value="no"> あまり楽しめなかった</label></fieldset><fieldset><legend>また遊びたいですか？</legend><label><input type="radio" name="again" value="yes"> はい</label><label><input type="radio" name="again" value="maybe"> 機会があれば</label><label><input type="radio" name="again" value="no"> いいえ</label></fieldset><fieldset><legend>自分の台本を投稿したいと思いましたか？</legend><label><input type="radio" name="submit" value="yes"> はい</label><label><input type="radio" name="submit" value="maybe"> 興味がある</label><label><input type="radio" name="submit" value="no"> いいえ</label></fieldset><fieldset><legend>どんな場面で使いたいですか？</legend><label><input type="radio" name="scene" value="alone"> 一人で</label><label><input type="radio" name="scene" value="friends"> 友人と</label><label><input type="radio" name="scene" value="work"> 職場・余興</label><label><input type="radio" name="scene" value="family"> 家族と</label><label><input type="radio" name="scene" value="other"> その他</label></fieldset><fieldset><legend>操作はわかりやすかったですか？</legend><label><input type="radio" name="ease" value="easy"> わかりやすい</label><label><input type="radio" name="ease" value="normal"> 普通</label><label><input type="radio" name="ease" value="hard"> 難しい</label></fieldset><fieldset id="favoriteField"><legend>気に入った台本はありますか？</legend><p>任意・複数選択できます。</p><div id="favoriteList" aria-live="polite">作品を読み込み中…</div></fieldset><button id="send" type="submit">回答を送信する</button><p id="status" role="status" aria-live="polite"></p></form></main><footer>© 2026 MICOLABO</footer><script>
const form=document.querySelector('#survey'),btn=document.querySelector('#send'),status=document.querySelector('#status');let sent=false;
(async()=>{const list=document.querySelector('#favoriteList');try{const r=await fetch('./scripts/catalog.json',{cache:'no-store'});if(!r.ok)throw Error();const items=await r.json();if(!Array.isArray(items))throw Error();list.replaceChildren();if(!items.length){list.textContent='公開作品はまだありません。';return;}for(const item of items){if(typeof item.id!=='string'||typeof item.title!=='string')continue;const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='favorite';input.value=item.id;label.append(input,document.createTextNode(' '+item.title));list.append(label);}const label=document.createElement('label'),none=document.createElement('input');none.type='checkbox';none.name='favorite';none.value='__none__';label.append(none,document.createTextNode(' 特になし'));list.append(label);list.addEventListener('change',e=>{if(e.target===none&&none.checked){for(const el of list.querySelectorAll('input'))if(el!==none)el.checked=false;}else if(e.target!==none&&e.target.checked)none.checked=false;});}catch(e){list.textContent='作品一覧を取得できませんでした。他の質問には回答できます。';}})();
try{sent=sessionStorage.getItem('mcSurveySent')==='1'}catch(e){}if(sent){btn.disabled=true;status.textContent='このセッションでは回答済みです。'}form.addEventListener('submit',async e=>{e.preventDefault();if(sent)return;const fd=new FormData(form);const data=Object.fromEntries(fd);const favorites=fd.getAll('favorite');if(favorites.length)data.favorite=favorites;if(!Object.keys(data).length){status.textContent='少なくとも1項目を選択してください。';return;}btn.disabled=true;status.textContent='送信中…';try{const r=await fetch('./api/survey',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'送信できませんでした。');sent=true;try{sessionStorage.setItem('mcSurveySent','1')}catch(e){}status.textContent='ご回答ありがとうございました。';}catch(e){status.textContent=e.message||'送信できませんでした。';btn.disabled=false;}});</script></body></html>
